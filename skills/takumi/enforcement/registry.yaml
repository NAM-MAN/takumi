# enforcement-coverage registry — rule → 強制機構の single source of truth
# 全 RULE anchor (<!-- RULE: id T#:mechanism -->) は必ずここに 1 entry を持つ。
# check-enforcement-coverage.mjs が双方向 orphan-zero で gate (M9 同型)。
# 設計: memory/gate_loop_context_redesign_2026_06_03.md / enforcement/README.md
schema_version: 1
created: 2026-06-03

# 軍師 codex gpt-5.5 バチバチ 2round 確定の閾値 (Wave 6 pilot GO/NO-GO の機械基準)
thresholds:
  evidence_required_false_ratio_max: 0.20   # 暫定RULE(evidence無)比率の上限 (軍師 1a)
  reviewer_quorum_normal: "2of2"            # 通常 T2 は 2 reviewer 一致で live
  reviewer_quorum_safety: "3of2"            # safety/高リスクは 3 中 2 quorum 必須
  reviewer_agreement_min_safety: 0.90       # 直近 50 件 agreement
  reviewer_seeded_pass_min: 0.95            # seeded違反スイート pass しないと live にしない
  agreement_advisory_below: 0.85            # 揺れ <0.85 → advisory 降格
  agreement_human_below: 0.80               # <0.80 → human-only

# safety 分類は LLM 禁止 (軍師 #3)
safety_policy:
  classification_by: human                  # safety 値は人間承認必須
  unclassified: fail-closed                 # 未分類は止める
  t2_solo_forbidden: true                   # safety は T1 or human、T2 単独禁止
  # safety ∈ {none, irreversible, security, data_loss}。autonomy.md §2 Layer2 path と一致

# coverage policy (2026-06-27 W0 指標現実化、軍師 codex gpt-5.5 Q4-2)
# 「全 section を RULE 化する」は明示的に NON-GOAL。希薄化に効くのは網羅率でなく
# 「事故実績 + safety + 高リスク」だけを機構化すること。進捗 KPI は section 網羅率でなく
# enforced rule 数 (evidence_required:true ∧ mechanism live) で測る。placeholder は捨てず
# 保持するが「未実装」として enforced とは別カウント (enforced と誤認させない)。
coverage_policy:
  full_section_anchoring: non-goal          # 1302 section 全 RULE 化は追わない (軍師 Q4-2)
  enforce_scope: [accident-proven, safety, high-risk]  # 機構化する対象の限定
  kpi: enforced_rule_count                  # 進捗は live enforced rule 数で測る (網羅率でない)
  provisional_policy: keep-uncounted        # placeholder は保持・但し enforced と別カウント

