name: "landing"
description: "LP・マーケティング画面。縦スクロール、hero + features + pricing、motion 豊富。"
layout:
  container: "w-full"
  sidebar: null
  content_padding: "px-6 md:px-12 py-16"
  grid_unit: 4
typography:
  scale_emphasis: "display"
  table_density: "comfortable"
interactions:
  row_hover: true
  row_focus_ring: true
  skeleton_loader: false
  optimistic_update: null   # stateless・mutation 無 (該当なし)。data-access-protocol.md
primary_patterns:
  - "hero"
  - "feature-grid"
  - "pricing"
  - "cta"
  - "footer"
required_components:
  - "Hero"
  - "FeatureGrid"
  - "Pricing"
  - "CTA"
  - "Footer"
layout_invariants:
  hard:
    - "hero は above-the-fold で完結、CTA 必須"
    - "pricing card は 3 列以内、mobile で 1 列"
    - "footer は全ページ共通 navigation を含む"
  soft:
    - "section 間 spacing は py-16 / py-24"
    - "feature は 3x2 または 2x3 グリッド"
    - "motion は scroll-triggered fade-up を標準"
ref_archetypes_fit:        # brand 名は seed でなく fit メタ。原理写像は craft-layer.md principle dictionary 経由
  - "Stripe"
  - "Linear"
  - "Vercel"
  - "Notion"

# craft 層 (craft-layer.md / craft-tokens.md / jp-typography.md)
locale_profile: "ja-JP"    # ja-JP | en-US | mixed
craft:                     # principle dictionary (brand 名でなく原理 enum で seed)
  density: "low"
  contrast_strategy: "bold"
  motion: "expressive"
  surface_depth: "soft-elevation"
  accent_discipline: "single-accent"
  type_personality: "editorial"
  color_system: "oklch-ramp-radix12"   # craft-tokens.md §1
  jp_typography: true                   # jp-typography.md base layer を emit
craft_invariants:
  soft:                                 # AI-slop blocklist (craft-layer.md §5)
    - "no_default_ai_font"
    - "no_purple_on_white_cliche"
    - "no_single_box_shadow"
    - "unjustified_component_count"
